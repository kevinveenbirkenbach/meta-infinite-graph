services:
  meta-infinite-graph:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${MIG_PORT:?set in .env (generated from default.env)}:80"
    volumes:
      # src is bind-mounted (not just COPY'd) so a frontend edit shows on
      # reload without a rebuild; writable so docker can create the nested
      # roles and infinito_meta mountpoints below it.
      - "./src:/usr/share/nginx/html"
      - "${INFINITO_ROLES_DIR:?set in .env (generated from default.env)}:/usr/share/nginx/html/roles:ro"
      - "${INFINITO_META_DIR:?set in .env (generated from default.env)}:/usr/share/nginx/html/infinito_meta:ro"
      # The CI ranking is declared here, not in the roles tree: the sort spec
      # and the lifecycle envelope live in this one file. Defaulted rather than
      # required, so an .env predating this mount still starts the stack; the
      # tests view then falls back to name order and says so.
      - "${INFINITO_ENV_FILE:-../infinito-nexus-core/default.env}:/etc/mig/infinito.env:ro"
      # Named, so a rebuild keeps the clone; dropping the volume costs one
      # full clone, not any data.
      - "mig-git:${MIG_GIT_HOME:?set in .env (generated from default.env)}"
    environment:
      MIG_GITHUB_TOKEN: "${MIG_GITHUB_TOKEN:-}"
      MIG_GIT_ROOT: "${MIG_GIT_ROOT:?set in .env (generated from default.env)}"
      MIG_GIT_FORKS: "${MIG_GIT_FORKS:?set in .env (generated from default.env)}"
      MIG_GIT_HOME: "${MIG_GIT_HOME:?set in .env (generated from default.env)}"

volumes:
  mig-git:
