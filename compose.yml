services:
  meta-infinite-graph:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${MIG_PORT:?set in .env (generated from default.env)}:80"
    volumes:
      # src is bind-mounted (not just COPY'd) so a frontend edit shows on
      # reload without a rebuild; writable so docker can create the nested
      # roles and meta mountpoints below it.
      - "./src:/usr/share/nginx/html"
      - "${INFINITO_ROLES_DIR:?set in .env (generated from default.env)}:/usr/share/nginx/html/roles:ro"
      - "${INFINITO_META_DIR:?set in .env (generated from default.env)}:/usr/share/nginx/html/meta:ro"
