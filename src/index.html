<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Meta Infinite Graph</title>

  <!-- Vendored so the app runs offline / behind a proxy with no CDN. -->
  <link rel="stylesheet" href="vendor/bootstrap.min.css">
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <!-- Top navbar with toggle -->
  <nav class="navbar navbar-dark bg-dark">
    <div class="container-fluid">
      <button class="btn btn-outline-light" type="button"
              data-bs-toggle="collapse" data-bs-target="#sidebar">
        ☰
      </button>
      <span class="navbar-brand ms-2">
        🕸️
        Meta Infinite Graph
      </span>
    </div>
  </nav>

  <!-- 3D-graph canvas -->
  <div id="graph3d"></div>

  <!-- Sidebar: static collapse, shown by default -->
  <div id="sidebar" class="collapse show">
    <div class="p-3 border-bottom">

      <!-- Role + selector -->
      <div class="mb-3">
        <label for="role-search" class="form-label">Search Role</label>
        <input
          type="text"
          id="role-search"
          class="form-control form-control-sm mb-2"
          placeholder="Type to filter…"
        />

        <label for="sel-role" class="form-label">Role</label>
        <select id="sel-role" class="form-select"></select>
      </div>

      <!-- Edge kinds -->
      <fieldset class="mb-2 small">
        <legend class="form-label mb-1">Edges</legend>
        <div class="form-check form-check-sm">
          <input class="form-check-input" type="checkbox" id="edge-dependencies" checked>
          <label class="form-check-label" for="edge-dependencies">Dependencies</label>
        </div>
        <div class="form-check form-check-sm">
          <input class="form-check-input" type="checkbox" id="edge-dependents" checked>
          <label class="form-check-label" for="edge-dependents">Dependents</label>
        </div>
        <div class="form-check form-check-sm">
          <input class="form-check-input" type="checkbox" id="edge-run-after">
          <label class="form-check-label" for="edge-run-after">Run-after flow</label>
        </div>
        <div class="form-check form-check-sm">
          <input class="form-check-input" type="checkbox" id="edge-role-deps">
          <label class="form-check-label" for="edge-role-deps">Ansible role dependencies</label>
        </div>
      </fieldset>

      <!-- Attribute facets -->
      <fieldset class="mb-2 small">
        <legend class="form-label mb-1">Filter</legend>
        <label class="form-label mb-0" for="facet-author">Author</label>
        <select id="facet-author" class="form-select form-select-sm mb-1"></select>
        <label class="form-label mb-0" for="facet-lifecycle">Lifecycle</label>
        <select id="facet-lifecycle" class="form-select form-select-sm mb-1"></select>
        <label class="form-label mb-0" for="facet-mode">Deploy mode</label>
        <select id="facet-mode" class="form-select form-select-sm"></select>
      </fieldset>

      <button id="btn-flow" class="btn btn-sm btn-outline-primary mb-2 w-100">
        ➡ Global run-after flow
      </button>

      <!-- Compact control bar -->
      <div class="input-group input-group-sm mb-3">
        <button id="btn-start" class="btn btn-primary">
          ▶
        </button>
        <button id="btn-stop" class="btn btn-secondary" disabled>
          ⏸
        </button>
        <span class="input-group-text">Interval</span>
        <input id="iter-interval"
               type="number"
               class="form-control text-center"
               min="0.1"
               step="0.1"
               value="0.5"
               title="Seconds"/>
        <button id="btn-zoom-in" class="btn btn-outline-dark">
          ➕
        </button>
        <button id="btn-zoom-out" class="btn btn-outline-dark">
          ➖
        </button>
        <button id="btn-reload" class="btn btn-outline-primary" title="Reload Graph">
          ↻
        </button>
      </div>

      <hr/>

      <!-- Legend -->
      <div class="mb-3 small">
        <div><span class="legend-dot bg-purple"></span>Start node</div>
        <div><span class="legend-dot bg-pink"></span>Selected</div>
        <div><span class="legend-dot bg-orange"></span>Pending ⏳ (auto-expanding)</div>
        <div><span class="legend-dot bg-green"></span>Internal</div>
        <div><span class="legend-dot bg-red"></span>Leaf</div>
        <div class="mt-1">
          <span class="legend-line" style="background:#8a8a8a"></span>dependency
          <span class="legend-line ms-2" style="background:#cfcfcf"></span>optional
        </div>
        <div>
          <span class="legend-line" style="background:#ff9f1c"></span>run_after
          <span class="legend-line ms-2" style="background:#4682b4"></span>ansible dep
        </div>
      </div>

      <hr/>

      <!-- Details panel -->
      <div id="details" class="small"></div>

      <hr/>

      <!-- Footer links -->
      <div class="small text-center">
        <a href="https://github.com/kevinveenbirkenbach/meta-infinite-graph" target="_blank">
          ⌥ Source
        </a> •
        <a href="https://www.veen.world" target="_blank">
          👤 Kevin Veen-Birkenbach
        </a> •
        ⚖ MIT License
      </div>
    </div>
  </div>

  <!-- Vendored libraries (matched three 0.146 + 3d-force-graph 1.73.4). -->
  <script src="vendor/three.min.js"></script>
  <script src="vendor/3d-force-graph.min.js"></script>
  <script src="vendor/bootstrap.bundle.min.js"></script>
  <script src="vendor/js-yaml.min.js"></script>

  <!-- App files -->
  <script src="dataLoader.js"></script>
  <script src="metaGraph.js"></script>
  <script src="selectionManager.js"></script>
  <script src="autoResolver.js"></script>
  <script src="graphRenderer.js"></script>
  <script src="uiManager.js"></script>
  <script src="app.js"></script>
</body>
</html>
