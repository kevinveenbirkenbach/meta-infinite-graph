<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Meta Infinite Graph</title>

  <!-- Vendored so the app runs offline / behind a proxy with no CDN. -->
  <link rel="stylesheet" href="vendor/bootstrap.min.css">
  <link rel="stylesheet" href="vendor/fontawesome/css/all.min.css">
  <link rel="stylesheet" href="styles.css" />
  <script src="themeSwitch.js"></script>
</head>
<body>

  <!-- Top navbar with toggle -->
  <nav class="navbar navbar-dark bg-dark">
    <div class="container-fluid">
      <button class="btn btn-outline-light" type="button"
              data-bs-toggle="collapse" data-bs-target="#sidebar">
        ☰
      </button>
      <span class="navbar-brand ms-2">
        🕸️
        Meta Infinite Graph
      </span>
      <div class="ms-auto d-flex align-items-center gap-2">
        <div class="btn-group btn-group-sm" role="group">
          <input type="radio" class="btn-check" name="view" id="view-graph" value="graph" checked>
          <label class="btn btn-outline-light" for="view-graph">3D</label>
          <input type="radio" class="btn-check" name="view" id="view-bond" value="bond">
          <label class="btn btn-outline-light" for="view-bond">Bond</label>
          <input type="radio" class="btn-check" name="view" id="view-ressources" value="ressources">
          <label class="btn btn-outline-light" for="view-ressources">Ressources</label>
          <input type="radio" class="btn-check" name="view" id="view-complexity" value="complexity">
          <label class="btn btn-outline-light" for="view-complexity">Complexity</label>
        </div>
        <button id="btn-filter" type="button" class="btn btn-sm btn-outline-light"
                title="Filter">🔍</button>
        <button id="btn-design" type="button" class="btn btn-sm btn-outline-light"
                title="Design">🎨</button>
      </div>
    </div>
  </nav>

  <!-- 3D-graph canvas -->
  <div id="graph3d"></div>

  <div id="tables-pane">
    <div id="tables"></div>
  </div>

  <div id="design-panel" class="side-panel" hidden>
    <div class="p-3">
      <h6 class="mb-3">Design</h6>

      <label class="form-label mb-1" for="design-theme">Theme</label>
      <select id="design-theme" class="form-select form-select-sm mb-3">
        <option value="system">Follow the system</option>
        <option value="light">Day</option>
        <option value="dark">Night</option>
      </select>

      <label class="form-label mb-1" for="design-font-size">
        Font size <span id="design-font-size-value">14</span>px
      </label>
      <input type="range" class="form-range mb-3" id="design-font-size"
             min="10" max="22" step="1" value="14">

      <label class="form-label mb-1" for="design-font-family">Font</label>
      <select id="design-font-family" class="form-select form-select-sm mb-3">
        <option value="sans">Sans</option>
        <option value="serif">Serif</option>
        <option value="mono">Mono</option>
      </select>

      <label class="form-label mb-1">Role names</label>
      <button id="btn-symbols" type="button" class="btn btn-sm btn-outline-primary w-100 mb-3"
              title="Show role names as text">🔤 Text</button>

      <label class="form-label mb-1" for="design-opacity">
        Background transparency <span id="design-opacity-value">5</span>%
      </label>
      <input type="range" class="form-range" id="design-opacity"
             min="0" max="50" step="1" value="5">
    </div>
  </div>

  <div id="sidebar" class="side-panel" hidden>
    <div class="p-3">

      <div class="mb-3 graph-only">
        <label for="role-search" class="form-label">Search Role</label>
        <input
          type="text"
          id="role-search"
          class="form-control form-control-sm mb-2"
          placeholder="Type to filter…"
        />

        <label for="sel-role" class="form-label">Role</label>
        <select id="sel-role" class="form-select"></select>
      </div>

      <fieldset id="filter-switches" class="mb-2 small">
        <legend class="form-label mb-1">Data</legend>
        <button id="btn-variants" type="button" class="btn btn-sm btn-outline-primary w-100"
                title="Variant aware: off">🧬 Variants</button>
      </fieldset>

      <fieldset class="mb-2 small graph-only">
        <legend class="form-label mb-1">Edges</legend>
        <div class="form-check form-check-sm">
          <input class="form-check-input" type="checkbox" id="edge-role-deps">
          <label class="form-check-label" for="edge-role-deps">Role Dependencies</label>
        </div>
        <div class="form-check form-check-sm">
          <input class="form-check-input" type="checkbox" id="edge-role-dependents">
          <label class="form-check-label" for="edge-role-dependents">Role Dependents</label>
        </div>
        <div class="form-check form-check-sm">
          <input class="form-check-input" type="checkbox" id="edge-dependencies" checked>
          <label class="form-check-label" for="edge-dependencies">Application Dependencies</label>
        </div>
        <div class="form-check form-check-sm">
          <input class="form-check-input" type="checkbox" id="edge-dependents" checked>
          <label class="form-check-label" for="edge-dependents">Application Dependents</label>
        </div>
        <div class="form-check form-check-sm">
          <input class="form-check-input" type="checkbox" id="edge-run-after">
          <label class="form-check-label" for="edge-run-after">Run-after flow</label>
        </div>
        <div class="form-check form-check-sm">
          <input class="form-check-input" type="checkbox" id="edge-visible" checked>
          <label class="form-check-label" for="edge-visible">Show connection lines</label>
        </div>
      </fieldset>

      <fieldset class="mb-2 small">
        <legend class="form-label mb-1">Filter</legend>
        <label class="form-label mb-0" for="facet-author">Author</label>
        <select id="facet-author" class="form-select form-select-sm mb-1"></select>
        <label class="form-label mb-0" for="facet-lifecycle">Lifecycle</label>
        <select id="facet-lifecycle" class="form-select form-select-sm mb-1"></select>
        <label class="form-label mb-0" for="facet-mode">Deploy mode</label>
        <select id="facet-mode" class="form-select form-select-sm"></select>
      </fieldset>

      <button id="btn-flow" class="btn btn-sm btn-outline-primary mb-2 w-100 graph-only">
        ➡ Global run-after flow
      </button>

      <div class="input-group input-group-sm mb-3 graph-only">
        <button id="btn-start" class="btn btn-primary">
          ▶
        </button>
        <button id="btn-stop" class="btn btn-secondary" disabled>
          ⏸
        </button>
        <span class="input-group-text">Interval</span>
        <input id="iter-interval"
               type="number"
               class="form-control text-center"
               min="0.1"
               step="0.1"
               value="0.5"
               title="Seconds"/>
        <button id="btn-zoom-in" class="btn btn-outline-primary">
          ➕
        </button>
        <button id="btn-zoom-out" class="btn btn-outline-primary">
          ➖
        </button>
        <button id="btn-reload" class="btn btn-outline-primary" title="Reload Graph">
          ↻
        </button>
      </div>

      <hr/>

      <div class="mb-3 small graph-only">
        <div><span class="legend-dot bg-purple"></span>Start node</div>
        <div><span class="legend-dot bg-pink"></span>Selected</div>
        <div><span class="legend-dot bg-orange"></span>Pending ⏳ (auto-expanding)</div>
        <div><span class="legend-dot bg-green"></span>Internal</div>
        <div><span class="legend-dot bg-red"></span>Leaf</div>
        <div class="mt-1">
          <span class="legend-line" style="background:#8a8a8a"></span>app dep
          <span class="legend-line ms-2" style="background:#cfcfcf"></span>optional
        </div>
        <div>
          <span class="legend-line" style="background:#ff9f1c"></span>run_after
          <span class="legend-line ms-2" style="background:#4682b4"></span>role dep
        </div>
      </div>

    </div>
  </div>

  <nav id="bottom-nav">
    <span id="status" class="text-muted"></span>
    <span class="bottom-nav-links">
      <a href="https://github.com/kevinveenbirkenbach/meta-infinite-graph" target="_blank">
        ⌥ Source
      </a>
      <a href="https://www.veen.world" target="_blank">
        👤 Kevin Veen-Birkenbach
      </a>
      <span>⚖ MIT License</span>
    </span>
  </nav>

  <!-- Vendored libraries (matched three 0.146 + 3d-force-graph 1.73.4). -->
  <script src="vendor/three.min.js"></script>
  <script src="vendor/3d-force-graph.min.js"></script>
  <script src="vendor/bootstrap.bundle.min.js"></script>
  <script src="vendor/js-yaml.min.js"></script>

  <!-- App files -->
  <script src="urlState.js"></script>
  <script src="dataLoader.js"></script>
  <script src="metaGraph.js"></script>
  <script src="metaTables.js"></script>
  <script src="roleInfo.js"></script>
  <script src="tableView.js"></script>
  <script src="selectionManager.js"></script>
  <script src="autoResolver.js"></script>
  <script src="graphRenderer.js"></script>
  <script src="uiManager.js"></script>
  <script src="app.js"></script>
</body>
</html>
