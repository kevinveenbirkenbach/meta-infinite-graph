<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Meta Infinite Graph</title>

  <!-- Vendored so the app runs offline / behind a proxy with no CDN. -->
  <link rel="stylesheet" href="vendor/bootstrap.min.css">
  <link rel="stylesheet" href="vendor/fontawesome/css/all.min.css">
  <link rel="stylesheet" href="styles.css" />
  <script src="themeSwitch.js"></script>
</head>
<body>

  <!-- Top navbar with toggle -->
  <nav class="navbar navbar-dark bg-dark">
    <div class="container-fluid">
      <button class="btn btn-outline-light" type="button"
              data-bs-toggle="collapse" data-bs-target="#sidebar">
        ☰
      </button>
      <span class="navbar-brand ms-2">
        🕸️
        Meta Infinite Graph
      </span>
      <div class="ms-auto d-flex align-items-center gap-2">
        <div class="btn-group btn-group-sm" role="group">
          <div class="btn-group btn-group-sm" role="group">
            <button id="btn-roles" type="button" class="btn btn-outline-light dropdown-toggle"
                    data-bs-toggle="dropdown" aria-expanded="false" data-i18n="view.roles"></button>
            <div class="dropdown-menu view-menu">
              <input type="radio" class="btn-check" name="view" id="view-graph" value="graph" checked>
              <label class="dropdown-item" for="view-graph" data-i18n="view.graph"></label>
              <input type="radio" class="btn-check" name="view" id="view-bond" value="bond">
              <label class="dropdown-item" for="view-bond" data-i18n="view.bond"></label>
              <input type="radio" class="btn-check" name="view" id="view-matrix" value="matrix">
              <label class="dropdown-item" for="view-matrix" data-i18n="view.matrix"></label>
            </div>
          </div>
          <input type="radio" class="btn-check" name="view" id="view-forks" value="forks">
          <label class="btn btn-outline-light" for="view-forks" data-i18n="view.forks"></label>
          <div class="btn-group btn-group-sm" role="group">
            <button id="btn-tests" type="button" class="btn btn-outline-light dropdown-toggle"
                    data-bs-toggle="dropdown" aria-expanded="false" data-i18n="view.tests"></button>
            <div class="dropdown-menu view-menu">
              <input type="radio" class="btn-check" name="view" id="view-playwright" value="playwright">
              <label class="dropdown-item" for="view-playwright" data-i18n="tests.kind.playwright"></label>
              <input type="radio" class="btn-check" name="view" id="view-cli" value="cli">
              <label class="dropdown-item" for="view-cli" data-i18n="tests.kind.cli"></label>
            </div>
          </div>
          <input type="radio" class="btn-check" name="view" id="view-commits" value="commits">
          <label class="btn btn-outline-light" for="view-commits" data-i18n="view.commits"></label>
          <input type="radio" class="btn-check" name="view" id="view-pulls" value="pulls">
          <label class="btn btn-outline-light" for="view-pulls" data-i18n="view.pulls"></label>
          <input type="radio" class="btn-check" name="view" id="view-actions" value="actions">
          <label class="btn btn-outline-light" for="view-actions" data-i18n="view.actions"></label>
          <input type="radio" class="btn-check" name="view" id="view-security" value="security">
          <label class="btn btn-outline-light" for="view-security" data-i18n="view.security"></label>
        </div>
        <button id="btn-filter" type="button" class="btn btn-sm btn-outline-light"
                data-i18n-title="panel.filter">🔍</button>
        <button id="btn-design" type="button" class="btn btn-sm btn-outline-light"
                data-i18n-title="panel.design">🎨</button>
      </div>
    </div>
  </nav>

  <!-- 3D-graph canvas -->
  <div id="graph3d"></div>

  <div id="tables-pane">
    <div id="tables"></div>
  </div>

  <div id="design-panel" class="side-panel" hidden>
    <div class="p-3">
      <h6 class="mb-3" data-i18n="panel.design"></h6>

      <label class="form-label mb-1" for="design-theme" data-i18n="design.theme"></label>
      <select id="design-theme" class="form-select form-select-sm mb-3">
        <option value="system" data-i18n="design.themeSystem"></option>
        <option value="light" data-i18n="design.themeDay"></option>
        <option value="dark" data-i18n="design.themeNight"></option>
      </select>

      <label class="form-label mb-1" for="design-font-size">
        <span data-i18n="design.fontSize"></span> <span id="design-font-size-value">14</span>px
      </label>
      <input type="range" class="form-range mb-3" id="design-font-size"
             min="10" max="22" step="1" value="14">

      <label class="form-label mb-1" for="design-font-family" data-i18n="design.font"></label>
      <select id="design-font-family" class="form-select form-select-sm mb-3">
        <option value="sans" data-i18n="design.fontSans"></option>
        <option value="serif" data-i18n="design.fontSerif"></option>
        <option value="mono" data-i18n="design.fontMono"></option>
      </select>

      <label class="form-label mb-1" data-i18n="design.roleNames"></label>
      <button id="btn-symbols" type="button" class="btn btn-sm btn-outline-primary w-100 mb-3"
              data-i18n-title="symbols.textTitle" data-i18n="symbols.text"></button>

      <div class="form-check">
        <input class="form-check-input" type="checkbox" id="design-resources" checked>
        <label class="form-check-label" for="design-resources" data-i18n="design.resources"></label>
      </div>

      <div class="form-check">
        <input class="form-check-input" type="checkbox" id="design-tags">
        <label class="form-check-label" for="design-tags" data-i18n="design.tags"></label>
        <div class="form-text" data-i18n="design.tagsHelp"></div>
      </div>

      <div class="form-check mb-3">
        <input class="form-check-input" type="checkbox" id="design-branches" checked>
        <label class="form-check-label" for="design-branches" data-i18n="design.branches"></label>
        <div class="form-text" data-i18n="design.branchesHelp"></div>
      </div>

      <label class="form-label mb-1" for="design-opacity">
        <span data-i18n="design.opacity"></span> <span id="design-opacity-value">5</span>%
      </label>
      <input type="range" class="form-range mb-3" id="design-opacity"
             min="0" max="100" step="1" value="5">

      <label class="form-label mb-1" for="matrix-columns-search" data-i18n="design.matrixColumns"></label>
      <div class="d-flex gap-1 mb-1">
        <input type="search" id="matrix-columns-search" class="form-control form-control-sm"
               data-i18n-placeholder="matrix.filterColumns">
        <button id="matrix-columns-reset" type="button" class="btn btn-sm btn-outline-primary"
                data-i18n-title="matrix.defaultTitle" data-i18n="matrix.default"></button>
      </div>
      <div id="matrix-columns" class="matrix-columns mb-3"></div>

      <label class="form-label mb-1" for="design-zoom">
        <span data-i18n="design.zoom"></span> <span id="design-zoom-value">100</span>%
      </label>
      <input type="range" class="form-range mb-3" id="design-zoom"
             min="40" max="250" step="5" value="100">

      <label class="form-label mb-1" for="design-language" data-i18n="design.language"></label>
      <select id="design-language" class="form-select form-select-sm"></select>
    </div>
  </div>

  <div id="sidebar" class="side-panel" hidden>
    <div class="p-3">

      <div class="mb-3 graph-only">
        <label for="role-search" class="form-label" data-i18n="filter.searchRole"></label>
        <input
          type="text"
          id="role-search"
          class="form-control form-control-sm mb-2"
          data-i18n-placeholder="filter.typeToFilter"
        />

        <label for="sel-role" class="form-label" data-i18n="filter.role"></label>
        <select id="sel-role" class="form-select"></select>
      </div>

      <fieldset class="mb-2 small forks-only">
        <legend class="form-label mb-1">GitHub</legend>
        <label class="form-label mb-0" for="fork-root" data-i18n="forks.repository"></label>
        <input type="text" id="fork-root" class="form-control form-control-sm mb-2"
               data-i18n-placeholder="forks.repositoryPlaceholder" autocomplete="off">
        <div class="token-field">
          <label class="form-label mb-0" for="fork-token" data-i18n="forks.token"></label>
          <input type="password" id="fork-token" class="form-control form-control-sm mb-1"
                 data-i18n-placeholder="forks.tokenPlaceholder" autocomplete="off">
          <div class="form-text mb-2" data-i18n="forks.tokenHelp"></div>
        </div>
        <div id="fork-token-owned" class="form-text mb-2" hidden data-i18n="forks.tokenOwned"></div>
        <button id="fork-forget" type="button" class="btn btn-sm btn-outline-primary w-100" data-i18n="forks.forget"></button>
      </fieldset>

      <fieldset class="mb-2 small tests-only">
        <legend class="form-label mb-1" data-i18n="tests.order"></legend>
        <label class="form-label mb-0" for="tests-sort" data-i18n="tests.sortBy"></label>
        <select id="tests-sort" class="form-select form-select-sm mb-2">
          <option value="name" data-i18n="tests.sort.name"></option>
          <option value="ci" data-i18n="tests.sort.ci"></option>
        </select>

        <label class="form-label mb-0" for="tests-gate" data-i18n="tests.gate"></label>
        <select id="tests-gate" class="form-select form-select-sm">
          <option value="all" data-i18n="tests.gateOption.all"></option>
          <option value="runs" data-i18n="tests.gateOption.runs"></option>
          <option value="never" data-i18n="tests.gateOption.never"></option>
          <option value="skipped" data-i18n="tests.gateOption.skipped"></option>
          <option value="always" data-i18n="tests.gateOption.always"></option>
          <option value="unknown" data-i18n="tests.gateOption.unknown"></option>
        </select>
      </fieldset>

      <fieldset id="filter-switches" class="mb-2 small">
        <legend class="form-label mb-1" data-i18n="filter.data"></legend>
        <button id="btn-variants" type="button" class="btn btn-sm btn-outline-primary w-100"
                data-i18n-title="variants.off" data-i18n="variants.button"></button>
      </fieldset>

      <fieldset class="mb-2 small graph-only">
        <legend class="form-label mb-1" data-i18n="edges.title"></legend>
        <div class="form-check form-check-sm">
          <input class="form-check-input" type="checkbox" id="edge-role-deps">
          <label class="form-check-label" for="edge-role-deps" data-i18n="edges.role-deps"></label>
        </div>
        <div class="form-check form-check-sm">
          <input class="form-check-input" type="checkbox" id="edge-role-dependents">
          <label class="form-check-label" for="edge-role-dependents" data-i18n="edges.role-dependents"></label>
        </div>
        <div class="form-check form-check-sm">
          <input class="form-check-input" type="checkbox" id="edge-dependencies" checked>
          <label class="form-check-label" for="edge-dependencies" data-i18n="edges.dependencies"></label>
        </div>
        <div class="form-check form-check-sm">
          <input class="form-check-input" type="checkbox" id="edge-dependents" checked>
          <label class="form-check-label" for="edge-dependents" data-i18n="edges.dependents"></label>
        </div>
        <div class="form-check form-check-sm">
          <input class="form-check-input" type="checkbox" id="edge-run-after">
          <label class="form-check-label" for="edge-run-after" data-i18n="edges.run-after"></label>
        </div>
        <div class="form-check form-check-sm">
          <input class="form-check-input" type="checkbox" id="edge-visible" checked>
          <label class="form-check-label" for="edge-visible" data-i18n="edges.visible"></label>
        </div>
      </fieldset>

      <fieldset class="mb-2 small">
        <legend class="form-label mb-1" data-i18n="panel.filter"></legend>
        <label class="form-label mb-0" for="facet-author" data-i18n="filter.author"></label>
        <select id="facet-author" class="form-select form-select-sm mb-1"></select>
        <label class="form-label mb-0" for="facet-lifecycle" data-i18n="filter.lifecycle"></label>
        <select id="facet-lifecycle" class="form-select form-select-sm mb-1"></select>
        <label class="form-label mb-0" for="facet-mode" data-i18n="filter.mode"></label>
        <select id="facet-mode" class="form-select form-select-sm"></select>
      </fieldset>

      <button id="btn-flow" class="btn btn-sm btn-outline-primary mb-2 w-100 graph-only" data-i18n="graph.flow"></button>

      <div class="input-group input-group-sm mb-3 graph-only">
        <button id="btn-start" class="btn btn-primary">
          ▶
        </button>
        <button id="btn-stop" class="btn btn-secondary" disabled>
          ⏸
        </button>
        <span class="input-group-text" data-i18n="graph.interval"></span>
        <input id="iter-interval"
               type="number"
               class="form-control text-center"
               min="0.1"
               step="0.1"
               value="0.5"
               data-i18n-title="graph.seconds"/>
        <button id="btn-reload" class="btn btn-outline-primary" data-i18n-title="graph.reload">
          ↻
        </button>
      </div>

      <hr/>

      <div class="mb-3 small graph-only">
        <div><span class="legend-dot bg-purple"></span><span data-i18n="legend.start"></span></div>
        <div><span class="legend-dot bg-pink"></span><span data-i18n="legend.selected"></span></div>
        <div><span class="legend-dot bg-orange"></span><span data-i18n="legend.pending"></span></div>
        <div><span class="legend-dot bg-green"></span><span data-i18n="legend.internal"></span></div>
        <div><span class="legend-dot bg-red"></span><span data-i18n="legend.leaf"></span></div>
        <div class="mt-1">
          <span class="legend-line" style="background:#8a8a8a"></span><span data-i18n="legend.appDep"></span>
          <span class="legend-line ms-2" style="background:#cfcfcf"></span><span data-i18n="legend.optional"></span>
        </div>
        <div>
          <span class="legend-line" style="background:#ff9f1c"></span>run_after
          <span class="legend-line ms-2" style="background:#4682b4"></span><span data-i18n="legend.roleDep"></span>
        </div>
      </div>

    </div>
  </div>

  <nav id="bottom-nav">
    <span id="view-loader" class="view-loader" role="status" tabindex="0" aria-haspopup="menu"></span>
    <span id="status" class="text-muted"></span>

    <span id="git-range" class="git-range" hidden>
      <span class="dropup">
        <button class="btn btn-sm btn-outline-secondary dropdown-toggle" type="button"
                id="btn-sources" data-bs-toggle="dropdown" data-bs-auto-close="outside"
                aria-expanded="false" data-i18n="range.sources"></button>
        <div class="dropdown-menu range-sources" id="range-sources"></div>
      </span>
      <span class="range-track">
        <label class="visually-hidden" for="range-from" data-i18n="range.from"></label>
        <input type="range" id="range-from">
        <label class="visually-hidden" for="range-to" data-i18n="range.to"></label>
        <input type="range" id="range-to">
      </span>
      <span id="range-label" class="range-label text-muted"></span>
      <span id="range-warning" class="range-warning" hidden></span>
    </span>

    <span class="bottom-nav-links">
      <a href="https://github.com/kevinveenbirkenbach/meta-infinite-graph" target="_blank">
        ⌥ <span data-i18n="bottom.source"></span>
      </a>
      <a href="https://www.veen.world" target="_blank">
        👤 Kevin Veen-Birkenbach
      </a>
      <span>⚖ MIT License</span>
    </span>
  </nav>

  <script src="vendor/three.min.js"></script>
  <script src="vendor/3d-force-graph.min.js"></script>
  <script src="vendor/bootstrap.bundle.min.js"></script>
  <script src="vendor/js-yaml.min.js"></script>

  <script type="importmap">
    {
      "imports": {
        "htm": "./vendor/htm/htm.module.js",
        "preact": "./vendor/preact/preact.module.js",
        "preact/hooks": "./vendor/preact/hooks.module.js"
      }
    }
  </script>
  <script type="module" src="app.js"></script>
</body>
</html>
