server {
  listen 80 default_server;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # The app assets are mounted live in dev; never let the browser serve a
  # stale bundle after an edit.
  location / {
    try_files $uri $uri/ =404;
    add_header Cache-Control "no-store";
  }

  # The roles tree is the live infinito repo mounted read-only; the JSON
  # autoindex is the directory scanner the frontend consumes.
  location /roles/ {
    autoindex on;
    autoindex_format json;
    add_header Cache-Control "no-store";
  }

  # Generated by docker-entrypoint.d/10-mig-github.sh, so it is absent from the
  # repository and nginx refuses to start unless the image creates it empty.
  include /etc/nginx/mig-github.conf;
}
